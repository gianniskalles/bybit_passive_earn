# config/carry.yaml — funding carry (CARRY_PLAN.md). Every field is required
# and checked by carry/config.py; the cycle refuses to start on any problem.
# DRY_RUN: true = paper trading. Only Giannis sets it to false (§10).

SYMBOLS: [BTCUSDT, ETHUSDT]            # decision Δ2
CYCLE_MINUTES: 5
DRY_RUN: true
LOG_DIR: /opt/hermes/logs/carry
ACCOUNT_TYPE: UNIFIED
EARN_COIN: USDT                        # layer A: USDT in Flexible Easy Earn (decision 13.3)

# Fees: fallbacks only; the cycle reads GET /v5/account/fee-rate at start.
SPOT_TAKER_FEE: 0.001
PERP_TAKER_FEE: 0.00055

# Entry / exit (§4). The ⊙ values are the recommended set of the Phase 0B
# calibration (a NO-GO: no set ever entered in 180 days). Decision 13.1: the
# entry rule is the gate; nothing is loosened to make it trade.
CALIBRATION_SOURCE: "calibration/CARRY_CALIBRATION.md (2026-09-27, NO-GO)"
ENTRY_MIN_EXPECTED_APR: 0.03
ENTRY_MIN_PREDICTED_RATE: 5.0e-05
ENTRY_EV_MULTIPLE: 1                   # MIN_HOLD income must repay >= 1 round trip
EXIT_PREDICTED_FLOOR: -0.0001
EXIT_HORIZON_HOURS: 72
SMOOTHING_SETTLEMENTS: 3
MIN_HOLD_HOURS: 72
MAX_ROUND_TRIPS_PER_30D: 2
NO_FUNDING_ACTION_BEFORE_SETTLEMENT_MIN: 15
MAX_ENTRY_BASIS_BPS: null              # from live snapshots (Phase 2)
MAX_SPREAD_BPS: null                   # from live snapshots (Phase 2)

# Size — decision Δ3 (an amount you can lose entirely).
TOTAL_CAPITAL_CAP_USD: null
MAX_NOTIONAL_PER_SYMBOL_USD: null
USDT_BUFFER_USD: null                  # stays in the UTA while a position is open (13.3)
MAX_USDT_BORROW_USD: 0

# Earn (decision 13.4): entry waits for a completed redeem; abandoned after this.
REDEEM_TIMEOUT_HOURS: 2

# Risk
MAX_HEDGE_DRIFT_PCT: 2.0
LEG_TIMEOUT_S: 30
MMR_WARN: 0.25
MMR_REDUCE: 0.40
MMR_EMERGENCY: 0.60
ADL_RANK_REDUCE: 4
CVR_DROP_ALERT: 0.05
UNDERPERFORMANCE_RATIO: 0.5
DEADMAN_URL: null                      # external liveness check (R33), e.g. healthchecks
