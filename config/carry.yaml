# config/carry.yaml — funding carry (CARRY_PLAN.md). Every field is required
# and checked by carry/config.py; the cycle refuses to start on any problem.
# DRY_RUN: true = paper trading. Only Giannis sets it to false (§10).

SYMBOLS: [ETHUSDT, BTCUSDT]            # decision 24 (~200 USDT); 13.11 (Δ2: BTC/ETH; alts need their own GO)
CYCLE_MINUTES: 5
DRY_RUN: true
LOG_DIR: /opt/hermes/logs/carry
ACCOUNT_TYPE: UNIFIED
EARN_COIN: USDT                        # layer A: USDT in Flexible Easy Earn (decision 13.3)

# Fees: fallbacks only; the cycle reads GET /v5/account/fee-rate at start.
SPOT_TAKER_FEE: 0.001
PERP_TAKER_FEE: 0.00055

# Entry / exit (§4). Decision 13.8: the Phase 0B calibration was a NO-GO in
# which no set ever entered, so its choice meant nothing. With MIN_HOLD 72 h
# the payback rule needed ~38 % APR; with 336 h, steady 0.01 %/8h (~11 %)
# enters. On the real last 180 days this set enters once per symbol (late
# August 2026, ~10 % APR) — see tests/test_carry_phase1.py. Decision 13.1: the
# entry rule is the gate; nothing is loosened to make it trade.
CALIBRATION_SOURCE: "CARRY_PLAN §13.8 (2026-09-28); calibration/CARRY_CALIBRATION.md (NO-GO)"
ENTRY_MIN_EXPECTED_APR: 0.05
ENTRY_MIN_PREDICTED_RATE: 5.0e-05
ENTRY_EV_MULTIPLE: 1                   # MIN_HOLD income must repay >= 1 round trip
EXIT_PREDICTED_FLOOR: -0.0001
EXIT_HORIZON_HOURS: 168
SMOOTHING_SETTLEMENTS: 9
MIN_HOLD_HOURS: 336
MAX_ROUND_TRIPS_PER_30D: 2
NO_FUNDING_ACTION_BEFORE_SETTLEMENT_MIN: 15
# Basis/spread: 24 h of live data, 2026-09-30 (calibration/CARRY_MARKET_SAMPLE.md,
# tools/carry_market_sample.py). The basis check is one-sided (2026-10-01): a
# perp above spot favours the short and comes with high funding, so an entry is
# refused only when basis < -MAX_ENTRY_BASIS_BPS, or when basis >
# MAX_FAVORABLE_BASIS_BPS, a plausibility limit against broken data.
MAX_ENTRY_BASIS_BPS: 6                 # ceil(p95 |basis|), BTC/ETH
MAX_FAVORABLE_BASIS_BPS: 100
MAX_SPREAD_BPS: 1                      # ceil(p99 spread), BTC/ETH

# Size — decisions Δ3, 13.9, 13.11. Enforced: buffer >= 10 % of the cap; the
# limits of all SYMBOLS add up to <= cap - buffer. The cycle also leaves out
# (with an alert) any symbol whose minimum position (instruments-info) does
# not fit its limit — carry/preflight.py.
# Decision 24: ~200 USDT, a limit per symbol: BTC 130 + ETH 50 + buffer 20
# = 200. The BTC minimum (perp 0.001, spot 0.001002 after the fee) fits 130
# up to a spot price of ~129,700 (85,300 on 30/9: +52 %); the ETH minimum
# (perp 0.01, spot 0.01002) fits 50 up to ~4,990 (2,417 on 17/10: +106 %).
# `preflight carry-symbols` reads both again with today's prices.
TOTAL_CAPITAL_CAP_USD: 200
MAX_NOTIONAL_BY_SYMBOL: {BTCUSDT: 130, ETHUSDT: 50}
MAX_NOTIONAL_PER_SYMBOL_USD: 50        # a core symbol not listed above (none now)
USDT_BUFFER_USD: 20                    # 10 % of the cap; stays in the UTA while a position is open (13.3)
# Decision 13.10: an altcoin in SYMBOLS needs its own GO
# (calibration/carry_alt_calibration.json, same thresholds as above) and this
# limit, which must be below MAX_NOTIONAL_PER_SYMBOL_USD. Unused while SYMBOLS
# holds only BTC/ETH.
MAX_NOTIONAL_PER_ALT_USD: 30
MAX_USDT_BORROW_USD: 0

# Earn (decision 13.4): entry waits for a completed redeem; abandoned after this.
REDEEM_TIMEOUT_HOURS: 2

# Risk
MAX_HEDGE_DRIFT_PCT: 2.0
LEG_TIMEOUT_S: 30
MMR_WARN: 0.25
MMR_REDUCE: 0.40
MMR_EMERGENCY: 0.60
ADL_RANK_REDUCE: 4
CVR_DROP_ALERT: 0.05
UNDERPERFORMANCE_RATIO: 0.5
DEADMAN_URL: null                      # always null here: the URL goes in /opt/hermes/.env (18/10)
